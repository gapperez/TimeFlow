name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Compilar para iPad (simulador)
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Versión de Xcode
        run: xcodebuild -version

      - name: Compilar
        run: |
          set -o pipefail
          xcodebuild build \
            -project TimeFlow.xcodeproj \
            -scheme TimeFlow \
            -destination 'generic/platform=iOS Simulator' \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO
